services:
  mysql:
    image: mysql:8.0
    container_name: quikfly_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quikfly_db
      MYSQL_USER: quikfly
      MYSQL_PASSWORD: quikfly_password
    ports:
      - "3308:3306"
    volumes:
      - quikfly_mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - quikfly_net

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: quikfly_backend
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: quikfly_db
      MYSQL_USER: quikfly
      MYSQL_PASSWORD: quikfly_password
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - quikfly_net

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: quikfly_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - quikfly_net

networks:
  quikfly_net:
    driver: bridge

volumes:
  quikfly_mysql_data:
